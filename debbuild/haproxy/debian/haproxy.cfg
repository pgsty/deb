# HAProxy package baseline configuration.
#
# The service loads this file first, then complete non-hidden *.cfg files from
# /etc/haproxy/conf.d in lexical order. Service fragments must start at a
# section boundary (for example: listen, frontend, or backend).
#
# The package provides a conservative TCP baseline, systemd-native logging,
# and loopback-only observability. It contains no credentials, node identity,
# deployment topology, or externally reachable listener.
#
# Documentation: https://docs.haproxy.org/3.4/configuration.html

global
    log stdout format short daemon
    chroot /var/lib/haproxy
    user haproxy
    group haproxy

defaults
    log global
    mode tcp
    option tcplog
    option log-separate-errors
    retries 3
    timeout connect 10s
    timeout client 1m
    timeout server 1m

# Port 9101 is the Pigsty HAProxy observability contract. It is loopback-only
# here; expose metrics remotely only in deployment-owned configuration with an
# explicit network policy.
frontend package-observability
    bind 127.0.0.1:9101
    mode http
    option dontlog-normal
    timeout http-request 10s
    monitor-uri /healthz
    stats enable
    stats uri /stats
    stats refresh 30s
    stats hide-version
    http-request use-service prometheus-exporter if { path /metrics }
